# ─── SERVER ─────────────────────────────────────────────
server:
  port: 8095
  servlet:
    context-path: /cms
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  application:
    name: cms-backend

    # ─── DATABASE ───────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/cms-database
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CMSHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ─── JPA / HIBERNATE ────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20
          lob:
            non_contextual_creation: true

  # ─── FLYWAY ─────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ─── CACHE ──────────────────────────────────────────
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

  # ─── WEBSOCKET / JACKSON ────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ─── ASYNC EXECUTOR ─────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: cms-async

    # ─── FILE UPLOADS ───────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  # ─── JWT ────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForCMSApplicationThatShouldBeChangedInProduction2024}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}        # 15 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}   # 7 days

  # ─── CLOUDINARY ─────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}
  folder-prefix: cms

  # ─── AWS S3 ─────────────────────────────────────────────
aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET:cms-documents-dev}
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}

  ses:
    enabled: ${AWS_SES_ENABLED:false}
    from-email: ${AWS_SES_FROM_EMAIL}

  # ─── FIREBASE ───────────────────────────────────────────
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
  enabled: ${FIREBASE_ENABLED:false}

  # ─── BREVO (EMAIL) ──────────────────────────────────────
brevo:
  api-key: ${BREVO_API_KEY:your-brevo-api-key}
  from-email: ${BREVO_FROM_EMAIL:noreply@yourapp.com}
  from-name: ${BREVO_FROM_NAME:Class Manager}
  enabled: ${BREVO_ENABLED:false}

  # ─── CORS ───────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

#  # ─── ACTUATOR ───────────────────────────────────────────
#  management:
#    endpoints:
#      web:
#        exposure:
#          include: health,info,metrics
#        base-path: /actuator
#    endpoint:
#      health:
#        show-details: when-authorized
#    info:
#      env:
#        enabled: true

  # ─── SPRINGDOC / SWAGGER ────────────────────────────────
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: Class Management System API
    version: 1.0.0
    description: SaaS Class Management System - REST API

  # ─── RATE LIMITING ──────────────────────────────────────
rate-limit:
  enabled: true
  login-attempts: 5          # Max failed login attempts
  login-window-minutes: 15   # Per window
  api-requests-per-minute: 100

  # ─── APP SETTINGS ───────────────────────────────────────
app:
  name: Class Manager
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  default-page-size: 20
  max-page-size: 100

swagger:
  local-url: http://localhost:8095/cms
  production-url: http://cms.com/cms

logging:
  config: log4j2-config.xml
  level:
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.zaxxer.hikari: TRACE
    com.classmanager.cms_backend: DEBUG
    root: INFO

# email template config
email:
  templates:
    base-path: ${EMAIL_TEMPLATES_BASE_PATH:classpath:/templates}
