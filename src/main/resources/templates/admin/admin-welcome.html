<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Account Credentials</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:24px 0;">
    <tr><td align="center">
        <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr><td style="background:#1d4ed8;padding:20px 28px;color:#ffffff;">
                <h2 style="margin:0;font-size:22px;">Welcome to {{instituteName}}</h2>
                <p style="margin:8px 0 0 0;font-size:14px;">Your admin account is ready</p>
            </td></tr>
            <tr><td style="padding:28px;">
                <p style="margin:0 0 14px 0;font-size:15px;">Hello {{fullName}},</p>
                <p style="margin:0 0 18px 0;font-size:15px;line-height:1.6;">
                    Your admin account has been created for {{instituteName}}.
                </p>
                <p style="margin:0 0 8px 0;"><strong>Login URL:</strong> <a href="{{loginUrl}}">{{loginUrl}}</a></p>
                <p style="margin:0 0 8px 0;"><strong>Login Email:</strong> {{loginEmail}}</p>
                <p style="margin:0 0 8px 0;"><strong>Temporary Password:</strong> {{temporaryPassword}}</p>
                <p style="margin:16px 0 0 0;font-size:14px;">Please change your password after your first login.</p>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
