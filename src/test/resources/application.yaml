spring:
  datasource:
    url: jdbc:h2:mem:cms-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

cors:
  allowed-origins: http://localhost:3000

jwt:
  secret: TestSecretKeyForJwtThatIsLongEnough123456
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

swagger:
  local-url: http://localhost:8095/cms
  production-url: http://cms.com/cms
